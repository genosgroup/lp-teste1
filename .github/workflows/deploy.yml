name: Deploy da landing page (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

# Permissões exigidas pelo deploy oficial do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Gerar o build de produção
        run: npm run build

      # Exige que o Pages já esteja ativado no repositório com
      # Source: GitHub Actions (Settings > Pages). É um passo único:
      # o GITHUB_TOKEN não tem permissão para criar o site do Pages.
      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (saída do Vite)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
