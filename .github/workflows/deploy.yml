name: Deploy da landing page (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

# Permissões exigidas pelo deploy oficial do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages no repositório automaticamente, sem passar
          # pelas configurações na mão. Exige a permissão pages: write.
          enablement: true

      - name: Empacotar o site (site estático na raiz)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
